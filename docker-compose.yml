version: '3.8'

services:
  backend:
    build: .
    container_name: hymn_remaker_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    volumes:
      - ./hymn_remaker/input:/app/hymn_remaker/input
      - ./hymn_remaker/output:/app/hymn_remaker/output
      - ./.cache:/app/.cache
      - ./client_secrets.json:/app/client_secrets.json
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hymn_remaker_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  daemon:
    build: .
    container_name: hymn_remaker_daemon
    command: ["python", "-m", "hymn_remaker.main", "--daemon"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    volumes:
      - ./hymn_remaker/input:/app/hymn_remaker/input
      - ./hymn_remaker/output:/app/hymn_remaker/output
      - ./.cache:/app/.cache
      - ./client_secrets.json:/app/client_secrets.json
    restart: unless-stopped
