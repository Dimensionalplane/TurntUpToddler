apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: hymn-remaker-worker:latest
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: openai-key
        - name: REPLICATE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: replicate-token
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: elevenlabs-key
        volumeMounts:
        - name: input-storage
          mountPath: /app/hymn_remaker/input
        - name: output-storage
          mountPath: /app/hymn_remaker/output
        - name: cache-storage
          mountPath: /app/.cache
      volumes:
      - name: input-storage
        persistentVolumeClaim:
          claimName: input-pvc
      - name: output-storage
        persistentVolumeClaim:
          claimName: output-pvc
      - name: cache-storage
        persistentVolumeClaim:
          claimName: cache-pvc
